  <style>
:root {
  font: 15px/1.5 Inter, "Segoe UI", system-ui, sans-serif;
  color: #20332e;
  background: #f4f6f1;
  --forest: #132b26;
  --green: #205544;
  --muted: #596b63;
  --line: #dde5dd;
  --paper: #fff;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #6da38e; outline-offset: 2px; }
[hidden] { display: none !important; }
.layout { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0, 1fr); }
.sidebar { display: flex; flex-direction: column; gap: 42px; min-height: 100vh; padding: 32px 18px 22px; color: #e4eee6; background: var(--forest); position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 12px; font-size: .85rem; line-height: 1.2; }
.sidebar .brand { padding-left: 8px; }
.brand strong { display: block; font-size: 1.15rem; margin-top: 4px; }
.brand-mark { display: grid; place-items: center; flex: 0 0 43px; height: 43px; border-radius: 12px; color: #22362c; background: #e0e9ac; font-size: .95rem; font-weight: 800; letter-spacing: -.05em; }
nav { display: grid; gap: 5px; }
.nav-item { min-height: 45px; border: 1px solid transparent; border-radius: 8px; color: #d6e2d9; background: transparent; text-align: left; padding: 8px 11px; display: flex; gap: 12px; align-items: center; font-size: .86rem; font-weight: 600; }
.nav-item span { color: #abc7b6; width: 18px; text-align: center; font-size: 1.15rem; line-height: 1; }
.nav-item.active, .nav-item:hover { background: #29473e; color: #fff; }
.nav-item.active { border-color: #496558; }
.nav-item.active span { color: #e0e9ac; }
.account { margin-top: auto; display: grid; gap: 13px; border-top: 1px solid #3d564d; padding: 17px 4px 0; }
.account-chip { display: flex; align-items: center; gap: 9px; font-size: .82rem; font-weight: 650; }
.account-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: #d9e7a6; }
.demo-role { color: #c0d1c7; }
.demo-role select { width: 100%; background: #29473e; color: white; border-color: #4f695d; }
main { padding: 30px clamp(18px, 3.4vw, 54px) 55px; min-width: 0; width: 100%; max-width: 1600px; margin-inline: auto; }
.demo-banner { color: #485c39; background: #e8edda; border: 1px solid #dce4cc; border-radius: 8px; padding: 8px 12px; margin-bottom: 22px; font-size: .82rem; }
.header { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(1.85rem, 4vw, 2.65rem); line-height: 1.12; letter-spacing: -.045em; color: #172e26; }
.header p { color: var(--muted); margin-top: 8px; }
.filters { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); margin-bottom: 18px; }
.filters .refresh { margin-left: auto; }
label { display: grid; align-content: start; gap: 5px; font-size: .8rem; font-weight: 650; }
input, select, textarea { color: #21372f; border: 1px solid #c5bcaa; background: #f8f3eb; border-radius: 7px; min-height: 38px; padding: 6px 10px; min-width: 0; font-size: .91rem; }
input[type="checkbox"] { min-height: auto; width: 16px; height: 16px; accent-color: var(--green); }
textarea { resize: vertical; }
.button { display: inline-flex; align-items: center; justify-content: center; padding: 7px 12px; border-radius: 8px; border: 1px solid transparent; font-size: .85rem; font-weight: 650; min-height: 38px; white-space: nowrap; }
.primary { color: white; background: var(--green); }
.primary:hover { background: #194636; }
.secondary { border-color: #cfdad1; color: #25463a; background: #fff; }
.secondary:hover, .text:hover { background: #edf3ef; }
.subtle { color: white; background: transparent; border-color: #4f695d; }
.text { background: transparent; color: #275845; min-height: 30px; padding: 4px 6px; }
.actions, .row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-actions { gap: 2px; min-width: max-content; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 18px; }
.metric, .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 13px; }
.metric { padding: 16px; }
.metric-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; font-size: .85rem; font-weight: 650; }
.metric-icon { display: grid; place-items: center; flex: 0 0 29px; height: 29px; border-radius: 8px; background: #ecf1e1; color: #355940; font-size: 1.05rem; }
.metric strong { font-size: clamp(1.6rem, 3vw, 2.15rem); color: #172e26; display: block; line-height: 1.15; margin: 6px 0; font-variant-numeric: tabular-nums; }
.metric small, .subline { color: var(--muted); }
.panel { overflow: hidden; margin-bottom: 15px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 19px; }
h2 { font-size: 1.1rem; color: #192f27; letter-spacing: -.02em; }
.panel-head p { color: var(--muted); font-size: .84rem; margin-top: 3px; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: .85rem; }
th, td { padding: 11px 15px; border-top: 1px solid #e7ece6; vertical-align: middle; }
th:first-child, td:first-child { padding-left: 19px; }
th { color: #52665c; background: #eceadd; font-weight: 650; font-size: .77rem; }
td strong { font-weight: 650; }
.subline { display: block; margin-top: 2px; }
td .subline:empty { display: none; }
tbody tr:hover { background: #ede8dd; }
.badge { display: inline-block; white-space: nowrap; background: #edf1f0; color: #4b6057; font-size: .76rem; font-weight: 650; border-radius: 40px; padding: 4px 8px; }
.badge.approved, .badge.passed, .badge.working { background: #e4f1e8; color: #25513d; }
.badge.submitted, .badge.trial, .badge.planned { background: #f7edd4; color: #71531e; }
.badge.retry, .badge.absent { background: #f8e7e1; color: #8a3f2c; }
.empty { color: var(--muted); border-top: 1px solid var(--line); padding: 25px 19px; }
dialog { width: min(560px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); padding: 0; border: 1px solid var(--line); border-radius: 15px; color: inherit; }
dialog::backdrop { background: #102a2399; }
dialog form { padding: 20px; }
dialog header, dialog footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
dialog header { margin-bottom: 14px; }
dialog footer { justify-content: flex-end; }
.close { border: 0; border-radius: 8px; background: #edf1ee; width: 36px; height: 36px; color: #264439; font-size: 1.2rem; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid label > input, .form-grid label > textarea, .form-grid label > select { width: 100%; }
.form-grid .check > input { width: 16px; }
.full { grid-column: 1 / -1; }
.editor-person { margin: 0 0 9px; font-size: .9rem; }
.editor-person .subline { display: inline; margin-left: 5px; }
.checks { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px 10px; }
.checks legend { font-size: .8rem; font-weight: 650; }
.check { display: flex; align-items: center; gap: 7px; padding: 4px 0; }
.form-error { color: #953b2d; font-size: .86rem; margin: 8px 0; }
#toast { display: none; position: fixed; z-index: 2; bottom: 16px; right: 16px; max-width: min(460px, calc(100vw - 32px)); background: #173e32; color: #fff; border-radius: 9px; padding: 11px 14px; box-shadow: 0 4px 20px #132b2629; }
#toast.visible { display: block; }
#toast.error { background: #842f24; }
.gate { min-height: 100vh; display: grid; place-items: center; }
.gate .panel { width: min(440px, 100%); padding: 27px; }
.gate h1 { margin: 20px 0 8px; font-size: 1.8rem; }
.gate p { color: var(--muted); }
.gate .form-error { color: #953b2d; }
.gate .actions { margin-top: 13px; }
.login-form { width: 100%; display: grid; gap: 10px; }
.login-form .form-error:empty { display: none; }
@media (max-width: 1030px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); }
  .sidebar { padding-inline: 12px; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .layout { display: block; }
  .sidebar { position: static; min-height: auto; height: auto; gap: 10px; padding: 12px; }
  .sidebar .brand { padding: 0; }
  .sidebar nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .nav-item { padding: 7px; min-height: 38px; gap: 4px; font-size: .78rem; }
  .account { display: flex; justify-content: space-between; align-items: center; padding: 7px 0 0; }
  .demo-role { max-width: 165px; }
  .demo-role select { min-height: 32px; font-size: .8rem; }
  main { padding: 16px 12px 32px; }
  .demo-banner, .header { margin-bottom: 14px; }
  .filters { padding: 10px; }
  .filters label:first-child { width: 100%; }
  .metric { padding: 11px; }
  .panel-head { padding: 13px; flex-wrap: wrap; }
  th:first-child, td:first-child { padding-left: 13px; }
  th, td { padding: 9px 10px; }
}
@media (max-width: 420px) {
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  input, select, textarea { font-size: 16px; }
}

.staff-toolbar, .staff-timing { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 16px; margin-bottom: 12px; }

/* Graphite and soft silver surfaces with muted gold accents. */
:root {
  --forest: #303938;
  --green: #404d4b;
  --paper: #e7eae9;
  --line: #c8cecc;
  --ink: #25302f;
  --gold: #d4b357;
  --raised: 7px 8px 16px #30393829, -5px -5px 12px #ffffff95;
  color: var(--ink);
  background: #dfe3e2;
}
body { background: linear-gradient(125deg, #e9eceb, #dce1df); }
.sidebar { background: linear-gradient(145deg, #485553, #303938); }
.brand-mark { background: var(--gold); color: #292820; }
.nav-item.active span, .account-dot { color: #efcf80; }
.account-dot { background: var(--gold); }
.header, .metric {
  background: linear-gradient(145deg, #4b5655, #353e3d);
  color: #fff;
  border-radius: 16px;
  box-shadow: var(--raised), inset 0 1px 0 #ffffff2e;
}
.header { padding: 14px 18px; border-bottom: 2px solid var(--gold); }
.header h1, .metric strong { color: #fff; }
.header p, .metric small, .metric .subline { color: #e1d6b8; }
:is(.metrics, .staff-metrics:not(.staff-shares)) > .metric:first-child {
  background: linear-gradient(135deg, #e3c575, #c8a447);
  color: #30291c;
}
:is(.metrics, .staff-metrics:not(.staff-shares)) > .metric:first-child :is(strong, small, .subline) { color: #30291c; }
.metric-icon { background: #e3cb8e; color: #383221; }
:is(.panel, .filters, dialog) {
  background: linear-gradient(140deg, #eef0ef, #e0e4e3);
  border: 1px solid #f6f8f7;
  border-radius: 16px;
  box-shadow: var(--raised);
}
.staff-timing {
  background: #dfe4e2;
  color: var(--ink);
  box-shadow: inset 3px 3px 8px #3039381c, inset -3px -3px 7px #ffffffaf;
  border-left: 3px solid #ad8e40;
}
.button.primary { background: linear-gradient(145deg, #53605e, #36413f); }
.button.primary:hover { background: #303938; }
.button.secondary { background: #e7ebea; border-color: #f3f5f4; box-shadow: var(--raised); }
.button.secondary:hover { background: #f2f4f3; }
.staff-group-table caption { background: #414d4b; color: #f9edcf; border-bottom: 2px solid var(--gold); }
.staff-group-table th { background: #e1e6e4; color: var(--ink); }
.staff-restaurant-table .staff-attendance-heading:nth-last-child(2) { background: #cedbd3; }
.staff-restaurant-table .staff-attendance-heading:last-child { background: #e8dac0; }
.staff-work-total, .staff-group-table tfoot { background: #e8dcc0; }
.staff-work-total td, .staff-work-total th, .staff-restaurant-cell,
.staff-restaurant-group { border-color: #a6afaa; }
.staff-track caption { background: #414d4b; color: #f9edcf; }
.staff-track thead th, .staff-track td.staff-track-total { background: #e8dcc0; }
.staff-track td.staff-track-nv { background: #cedbd3; }
@media (max-width: 700px) {
  :root { --raised: 3px 4px 9px #30393826, -2px -2px 6px #ffffff80; }
  .header { padding: 10px 12px; }
  #staff-entry .staff-input-table tr { background: #e8ecea; box-shadow: var(--raised); }
}

/* Daily Report – F&B */
:root {
  --gold: #d8b556;
  --paper: #e4e7e6;
  --line: #ced4d2;
  --ink: #242d2c;
  --raised: 8px 10px 19px #2c36332b, -7px -7px 17px #ffffffbc;
  --inset: inset 6px 7px 13px #30393827, inset -6px -6px 12px #ffffffb5;
}
body { background: linear-gradient(135deg, #f1f3f2, #dfe4e2); }
.sidebar { background: linear-gradient(155deg, #4c5755, #303937); }
.brand-mark { background: linear-gradient(145deg, #dfbf61, #c8a049); }
.header {
  background: radial-gradient(ellipse at right, #595641, transparent 56%), linear-gradient(145deg, #4b5654, #343d3b);
  padding: clamp(14px, 2vw, 25px);
  border-bottom: 3px solid var(--gold);
  border-radius: 24px;
}
.header h1 { font-family: Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
.header p { color: #efcc73; }
:is(.panel, .filters, dialog, .metric) { border-radius: 22px; }
:is(.panel, .filters, dialog) { background: #e5e8e7; }
.metric { background: linear-gradient(138deg, #525d5a, #343d3b); border-color: #56605c; }
.metric > :is(span, .metric-head) {
  color: #f1ce74;
  font-size: .82rem;
  font-weight: 750;
  letter-spacing: .055em;
  text-transform: uppercase;
}
:is(.metrics, .staff-metrics:not(.staff-shares)) > .metric:first-child {
  background: linear-gradient(138deg, #dfbb5b, #b99137);
  border-color: #dbb65a;
}
:is(.metrics, .staff-metrics:not(.staff-shares)) > .metric:first-child > :is(span, .metric-head) { color: #352c1e; }
:is(.metrics, .staff-metrics:not(.staff-shares)) > .metric:first-child strong {
  color: white;
  text-shadow: 0 2px 4px #33271255;
}
.staff-shares > .metric {
  background: #e2e6e4;
  border: 0;
  box-shadow: var(--inset);
}
.staff-shares > .metric :is(span, strong) { color: var(--ink); }
.staff-shares > .metric :is(small, .subline) { color: var(--muted); }
.staff-timing, .filters :is(input, select), .staff-toolbar input { box-shadow: var(--inset); }
.button.secondary { border-radius: 10px; }
.staff-subnav .button { border-radius: 12px; }
@media (max-width: 700px) {
  :root { --raised: 4px 5px 10px #2c36332b, -3px -3px 8px #ffffffb5; }
  :is(.header, .panel, .filters, dialog, .metric) { border-radius: 16px; }
}

.staff-metric-dialog{width:min(530px,calc(100% - 28px));max-height:80vh;overflow:auto;border:1px solid #a0b2aa;border-radius:16px;padding:18px;background:#f4f6f3;color:#192e27}.staff-metric-dialog::backdrop{background:#14282188}.staff-metric-dialog header{display:flex;justify-content:space-between;align-items:start;gap:10px}.staff-metric-dialog h2{margin:0}.staff-metric-dialog li{padding:7px 0}.staff-metric-dialog small{display:block}.staff-metric-dialog dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.staff-metric-dialog dl div{padding:9px;background:#e4eee8;border-radius:8px}.staff-metric-dialog dd{font-size:1.3rem;font-weight:bold;margin:4px 0 0}

@media (min-width: 701px) {
  #staff-entry .staff-input-table:has(.staff-received-cell) {
    --staff-desktop-columns: minmax(200px, 2.6fr) repeat(4, minmax(64px, 1fr)) minmax(86px, .65fr);
    display: block;
  }
  #staff-entry .staff-input-table:has(.staff-received-cell) :is(thead, tbody) { display: block; }
  #staff-entry .staff-input-table:has(.staff-received-cell) tr {
    display: grid;
    grid-template-columns: var(--staff-desktop-columns);
  }
  #staff-entry .staff-input-table .staff-received-cell { display: contents; }
  #staff-entry .staff-received-cell > [data-staff-remove] { grid-area: 1 / 6; justify-self: start; align-self: start; }
  #staff-entry .staff-received-fields {
    grid-area: 2 / 1 / auto / -1;
    grid-template-columns: var(--staff-desktop-columns);
    gap: 0;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-block: 4px 6px;
  }
  #staff-entry .staff-received-fields strong { grid-column: 1; padding-inline: 8px; }
  #staff-entry .staff-received-fields label { min-width: 0; padding-inline: 5px; }
  #staff-entry .staff-received-fields input { min-width: 0; box-sizing: border-box; }
}

.staff-share-layout{display:flex;align-items:center;gap:16px;padding:0 12px 12px}.staff-share-layout>:is(.staff-metrics,dl){flex:1;min-width:0;margin:0}.staff-pie{flex:none;width:clamp(105px,15vw,165px);aspect-ratio:1;border-radius:50%;background:var(--staff-pie)}.staff-share-layout :is(.metric,dl>div){border-left:4px solid var(--staff-group)}.staff-allocation-alert{flex-basis:100%;margin:4px 0;background:#fff0e9;color:#8d2b20;padding:8px 10px;border-radius:8px}.staff-allocation-ok{background:#e3f2e7;color:#23643d}.staff-allocation-pending{display:block;margin-top:4px;color:#8d2b20;font-weight:700}
@media(max-width:700px){.staff-share-layout{flex-direction:column;align-items:stretch}.staff-pie{align-self:center}}
#staff-entry :is(td[data-staff-kind="0"] input,input[name="received-0"],input[name="off-0"]) { background:#ceead9; border-color:#729a80; color:#24332e; }
#staff-entry :is(td[data-staff-kind="1"] input,input[name="received-1"],input[name="off-1"]) { background:#d4e7fc; border-color:#789ab8; color:#24332e; }
#staff-entry :is(td[data-staff-kind="2"] input,input[name="received-2"],input[name="off-2"]) { background:#eadbf6; border-color:#a88ab9; color:#24332e; }
#staff-entry :is(td[data-staff-kind="3"] input,input[name="received-3"],input[name="off-3"]) { background:#ffdfd0; border-color:#ba8979; color:#24332e; }
.staff-track-index { width: 6%; }
.staff-track-outlet { width: 23%; }
.staff-track-group { width: 11%; }
.staff-track-sum { width: 11%; }
.staff-track-note-col { width: 16%; }
.staff-track tbody td, .staff-track tfoot td { font-variant-numeric: tabular-nums; }
@media (max-width: 700px) {
  .staff-track-scroll { padding-inline: 4px; }
  .staff-track { min-width: 0; }
  .staff-track-outlet { width: 20%; }
  .staff-track-group { width: 12%; }
  .staff-track-sum { width: 12%; }
  .staff-track-note-col { width: 14%; }
  .staff-track th, .staff-track td { padding-inline: 1px; font-size: clamp(.61rem, 2.8vw, .78rem); }
  .staff-track caption { padding: 6px 4px; font-size: clamp(.82rem, 3.5vw, 1rem); }
  .staff-track tfoot [data-headcount-share] { font-size: clamp(.6rem, 2.65vw, .75rem); white-space: nowrap; }
  .staff-track td input[data-headcount-cell] { height: 28px; padding-inline: 0; font-size: .72rem; }
}
.staff-restaurant-chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; padding: 0 12px 12px; }
.staff-restaurant-chart { min-width: 0; padding: 12px; border: 1px solid #cbd6d0; border-radius: 12px; background: #f9fbf9; color: #203b31; }
.staff-restaurant-chart h3 { margin: 0 0 10px; font-size: 1rem; overflow-wrap: anywhere; }
.staff-restaurant-chart p { margin: 0; font-size: .84rem; }
.staff-restaurant-breakdown { display: flex; align-items: center; gap: 14px; }
.staff-restaurant-breakdown .staff-pie { width: clamp(66px, 24vw, 94px); }
.staff-restaurant-breakdown dl { flex: 1; min-width: 0; margin: 0; font-size: .82rem; font-variant-numeric: tabular-nums; }
.staff-restaurant-breakdown dl div { display: flex; align-items: baseline; justify-content: space-between; gap: 5px; padding-block: 2px; }
.staff-restaurant-breakdown dt { white-space: nowrap; }
.staff-restaurant-breakdown dd { margin: 0; font-weight: 700; white-space: nowrap; }
.staff-restaurant-breakdown dt i { display: inline-block; width: .65em; height: .65em; margin-right: .38em; border-radius: 50%; background: var(--group-color); }
#staff-revision-count:not([hidden]) { display:inline-grid; place-items:center; min-width:1.35em; padding:0 .32em; border-radius:999px; background:#b42318; color:#fff; font-size:.85em; font-weight:800; margin-inline-start:.3em; }
.revision-increase { color:#17643b; font-weight:800; }
.revision-decrease { color:#aa221c; font-weight:800; }
.staff-metric-dialog [data-revision] { padding:12px; margin-block:6px; }
.staff-metric-dialog [data-revision] h3 { margin:0 0 6px; }
.staff-metric-dialog [data-revision] p { margin:4px 0; }
.staff-metric-dialog .revision-summary { list-style:none; padding:0; margin:6px 0; }
.staff-metric-dialog .revision-summary li { padding:3px 0; margin:0; }
.revision-groups { display:flex; flex-wrap:wrap; gap:3px 12px; }
.revision-change { white-space:nowrap; }
.revision-full { margin:6px 0; }
.revision-full summary { cursor:pointer; }
</style>
</head>
